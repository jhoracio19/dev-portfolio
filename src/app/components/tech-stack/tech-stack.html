<section id="tecnologias" class="content-section">
  <div class="section-heading">
    <div>
      <h2>{{ t().tech.title }}</h2>
      <p>{{ t().design.stackIntro }}</p>
    </div>
  </div>
  <div class="stack-grid">
    <div class="stack-group">
      <h3><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Frontend</h3>
      <div class="tech-list">
        <span class="tech-item tech-react"><i class="fa-brands fa-react" aria-hidden="true"></i>React</span>
        <span class="tech-item tech-next"><span class="tech-monogram" aria-hidden="true">N</span>Next.js</span>
        <span class="tech-item tech-angular"><i class="fa-brands fa-angular" aria-hidden="true"></i>Angular</span>
        <span class="tech-item tech-typescript"><span class="tech-monogram" aria-hidden="true">TS</span>TypeScript</span>
        <span class="tech-item tech-html"><i class="fa-brands fa-html5" aria-hidden="true"></i>HTML</span>
        <span class="tech-item tech-css"><i class="fa-brands fa-css3-alt" aria-hidden="true"></i>CSS</span>
        <span class="tech-item tech-tailwind"><i class="fa-solid fa-wind" aria-hidden="true"></i>Tailwind CSS</span>
      </div>
    </div>
    <div class="stack-group">
      <h3><i class="fa-solid fa-server" aria-hidden="true"></i> Backend</h3>
      <div class="tech-list">
        <span class="tech-item tech-python"><i class="fa-brands fa-python" aria-hidden="true"></i>Django</span>
        <span class="tech-item tech-php"><i class="fa-brands fa-php" aria-hidden="true"></i>PHP</span>
        <span class="tech-item tech-fastapi"><i class="fa-solid fa-bolt" aria-hidden="true"></i>FastAPI</span>
        <span class="tech-item tech-postgres"><i class="fa-solid fa-database" aria-hidden="true"></i>PostgreSQL</span>
        <span class="tech-item tech-mysql"><i class="fa-solid fa-database" aria-hidden="true"></i>MySQL</span>
        <span class="tech-item tech-supabase"><i class="fa-solid fa-bolt-lightning" aria-hidden="true"></i>Supabase</span>
      </div>
    </div>
    <div class="stack-group">
      <h3><i class="fa-solid fa-code-branch" aria-hidden="true"></i> {{ t().design.workflow }}</h3>
      <div class="tech-list">
        <span class="tech-item tech-git"><i class="fa-brands fa-git-alt" aria-hidden="true"></i>Git</span>
        <span class="tech-item tech-github"><i class="fa-brands fa-github" aria-hidden="true"></i>GitHub</span>
        <span class="tech-item tech-docker"><i class="fa-brands fa-docker" aria-hidden="true"></i>Docker</span>
        <span class="tech-item tech-linux"><i class="fa-brands fa-linux" aria-hidden="true"></i>Linux</span>
        <span class="tech-item tech-google"><i class="fa-brands fa-google" aria-hidden="true"></i>Google Cloud</span>
        <span class="tech-item tech-api"><i class="fa-solid fa-plug" aria-hidden="true"></i>APIs</span>
      </div>
    </div>
  </div>
</section>
