<footer id="contacto" class="contact-section">
  <div class="contact-inner">
    <div class="contact-heading">
      <span class="availability">{{ t().hero.available }}</span>
      <h2>{{ t().design.contactTitle }}</h2>
      <p>{{ t().design.contactIntro }}</p>
    </div>
    <div class="contact-actions">
      <a href="mailto:jhoracio19@hotmail.com" class="contact-email">jhoracio19&#64;hotmail.com</a>
      <div class="action-row">
        <a href="mailto:jhoracio19@hotmail.com" class="button button-primary"
          ><i class="fa-solid fa-paper-plane" aria-hidden="true"></i>{{
          t().design.sendEmail
        }}</a
        ><button type="button" (click)="copyEmail()" class="button button-secondary">
          <i
            class="fa-solid"
            [class.fa-copy]="!emailCopied()"
            [class.fa-check]="emailCopied()"
            aria-hidden="true"
          ></i>
          {{ t().contact.copy_email }}
        </button>
      </div>
      <p class="copy-status" role="status">
        {{ emailCopied() ? t().contact.email_copied : copyFailed() ? t().design.copyFailed : '' }}
      </p>
    </div>
    <div class="footer-bottom">
      <span class="footer-signature"><img src="jh-mark.svg" alt="" width="40" height="40" />José Horacio © 2026</span>
      <div class="social-links">
        <a href="https://github.com/jhoracio19" target="_blank" rel="noopener noreferrer"
          ><i class="fa-brands fa-github" aria-hidden="true"></i><span>GitHub</span></a
        ><a href="https://www.linkedin.com/in/jhoracio19/" target="_blank" rel="noopener noreferrer"
          ><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i><span>LinkedIn</span></a
        ><a href="https://jhdevagency.com/" target="_blank" rel="noopener noreferrer"
          ><i class="fa-solid fa-building" aria-hidden="true"></i><span>JH Dev Agency</span></a
        >
      </div>
    </div>
  </div>
</footer>
