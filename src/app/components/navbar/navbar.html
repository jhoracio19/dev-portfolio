<a href="#main-content" class="skip-link">{{ t().design.skip }}</a>
<header class="site-header">
  <nav
    class="nav-inner"
    [attr.aria-label]="t().design.navigation"
    (keydown)="onMenuKeydown($event)"
  >
    <a routerLink="/" fragment="inicio" class="brand" (click)="closeMenu(false)"
      ><img src="jh-mark.svg" class="brand-mark" alt="" width="40" height="40" /><span class="brand-name">José Horacio<span>Fullstack developer</span></span></a
    >
    <div class="nav-controls">
      <button type="button" class="theme-button" (click)="themeService.toggle()"
        [attr.aria-label]="langService.lang() === 'es' ? (themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro') : (themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode')"
        [attr.title]="langService.lang() === 'es' ? (themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro') : (themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode')">
        @if (themeService.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 13.5A9 9 0 0 1 10.5 3a9 9 0 1 0 10 10.5Z"/></svg>
        }
      </button>
      <button
        type="button"
        class="language-button"
        (click)="langService.toggleLanguage()"
        [attr.aria-label]="langService.lang() === 'es' ? 'Switch to English' : 'Cambiar a español'"
      >
        {{ langService.lang() === 'es' ? 'EN' : 'ES' }}</button
      ><button
        #menuToggle
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="menu-links"
        [attr.aria-label]="isMenuOpen() ? t().design.closeMenu : t().design.openMenu"
      >
        <span class="menu-icon" [class.is-open]="isMenuOpen()" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
    <div id="menu-links" class="nav-links" [class.is-open]="isMenuOpen()" [attr.inert]="isMobile() && !isMenuOpen() ? '' : null" [attr.aria-hidden]="isMobile() && !isMenuOpen() ? 'true' : null" data-lenis-prevent>
      @for (item of links(); track item.id) {
        <a
          routerLink="/"
          [fragment]="item.id"
          (click)="closeMenu(false)"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
          >{{ item.label }}</a
        >
      }
      <a
        routerLink="/"
        fragment="contacto"
        class="button button-secondary nav-contact"
        (click)="closeMenu(false)"
        >{{ t().design.talk }}</a
      >
    </div>
  </nav>
</header>
