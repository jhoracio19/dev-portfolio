<nav
  class="sticky top-0 z-50 flex items-center justify-between bg-slate-900/90 backdrop-blur-md px-6 py-4 text-white shadow-xl"
>
  <div class="flex flex-col z-[60]">
    <span class="text-xl font-bold tracking-tight">
      José <span class="text-sky-400">Horacio</span>
    </span>
    <span class="text-xs font-medium text-slate-400 uppercase tracking-widest whitespace-nowrap">
      Fullstack Developer
    </span>
  </div>

  <div class="flex items-center gap-4 lg:hidden z-[60]">
    <!-- Selector de idioma móvil -->
    <button
      type="button"
      (click)="langService.toggleLanguage()"
      [attr.aria-label]="langService.lang() === 'es' ? 'Cambiar idioma a inglés' : 'Switch language to Spanish'"
      class="bg-slate-800 border border-slate-700 px-2 py-1 rounded text-xs font-bold text-sky-400"
    >
      {{ langService.lang() === 'es' ? 'EN' : 'ES' }}
    </button>
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="menu-links"
      class="text-white p-2 transition-transform active:scale-90"
    >
      <i aria-hidden="true" class="fas text-2xl" [class.fa-bars]="!isMenuOpen()" [class.fa-times]="isMenuOpen()"></i>
    </button>
  </div>

  <div
    id="menu-links"
    [class.hidden]="!isMenuOpen()"
    [class.flex]="isMenuOpen()"
    class="fixed lg:static top-0 right-0 h-screen lg:h-auto w-full lg:w-auto bg-slate-900/95 lg:bg-transparent backdrop-blur-lg lg:backdrop-blur-none flex-col lg:flex-row items-center justify-center gap-10 lg:gap-5 font-medium transition-all duration-300 ease-in-out lg:flex"
  >
    <a
      (click)="setActive('inicio')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'inicio'"
      [class.text-white]="activeSection() !== 'inicio'"
      routerLink="/"
      fragment="inicio"
      >{{ t().nav.home }}</a
    >
    <a
      (click)="setActive('experiencia')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'experiencia'"
      [class.text-white]="activeSection() !== 'experiencia'"
      routerLink="/"
      fragment="experiencia"
      >{{ t().nav.experience }}</a
    >
    <a
      (click)="setActive('hackathones')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'hackathones'"
      [class.text-white]="activeSection() !== 'hackathones'"
      routerLink="/"
      fragment="hackathones"
      >{{ t().nav.hackathons }}</a
    >
    <a
      (click)="setActive('proyectos')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'proyectos'"
      [class.text-white]="activeSection() !== 'proyectos'"
      routerLink="/"
      fragment="proyectos"
      >{{ t().nav.projects }}</a
    >
    <a
      (click)="setActive('tecnologias')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'tecnologias'"
      [class.text-white]="activeSection() !== 'tecnologias'"
      routerLink="/"
      fragment="tecnologias"
      >{{ t().nav.tech }}</a
    >
    <a
      (click)="setActive('sobre-mi')"
      class="text-2xl lg:text-sm xl:text-base transition-all hover:scale-110 cursor-pointer whitespace-nowrap"
      [class.text-sky-400]="activeSection() === 'sobre-mi'"
      [class.text-white]="activeSection() !== 'sobre-mi'"
      routerLink="/"
      fragment="sobre-mi"
      >{{ t().nav.about }}</a
    >

    <div class="flex lg:hidden items-center gap-8 mt-4">
      <a aria-label="GitHub de José Horacio (abre en una pestaña nueva)" rel="noopener noreferrer" class="text-3xl hover:text-sky-400" href="https://github.com/jhoracio19" target="_blank"
        ><i aria-hidden="true" class="fab fa-github"></i
      ></a>
      <a
        class="bg-sky-600 px-8 py-3 rounded-xl font-bold"
        href="https://www.linkedin.com/in/jhoracio19/"
        target="_blank"
        rel="noopener noreferrer"
        >LinkedIn</a
      >
    </div>
  </div>

  <div class="hidden lg:flex items-center gap-3 xl:gap-6 ml-4 xl:ml-8 flex-shrink-0">
    <!-- Selector de idioma escritorio -->
    <button
      type="button"
      (click)="langService.toggleLanguage()"
      [attr.aria-label]="langService.lang() === 'es' ? 'Cambiar idioma a inglés' : 'Switch language to Spanish'"
      class="hover:scale-110 transition-transform bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold text-sky-400 cursor-pointer whitespace-nowrap"
    >
      <i class="fas fa-globe mr-2"></i> {{ langService.lang() === 'es' ? 'English' : 'Español' }}
    </button>

    <a
      class="hover:scale-110 transition-transform opacity-80 hover:opacity-100"
      target="_blank"
      href="https://github.com/jhoracio19"
      rel="noopener noreferrer"
      aria-label="GitHub de José Horacio (abre en una pestaña nueva)"
    >
      <i aria-hidden="true" class="fab fa-github text-xl"></i>
    </a>
    <a
      class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg shadow-sky-900/20 transition-all whitespace-nowrap"
      target="_blank"
      href="https://www.linkedin.com/in/jhoracio19/"
      rel="noopener noreferrer"
    >
      LinkedIn
    </a>
  </div>
</nav>
